seo:`<h2>Age Calculator by Date of Birth</h2><p>CalcHub's age calculator helps you find chronological age from a date of birth in a clear, calendar-based way. Enter the day, month and year of birth, and you can optionally add a birth time when a more precise elapsed-time result is useful. The calculator shows age in years, months and days, along with total months, weeks, days, hours, minutes and seconds where appropriate. It also shows the day of the week you were born, your zodiac sign, your next birthday and the age you will turn.</p><h3>How to use the age calculator</h3><p>Select your birth day, month and year from the dropdowns. If you know the birth time, add it in the optional time field. Then select Calculate age. The result uses the current date and time and follows calendar-based month and year changes rather than treating every month as a fixed number of days.</p><h3>Why chronological age matters</h3><p>Chronological age is the amount of time that has passed since a person's date of birth. It is useful for understanding birthdays, age-based eligibility, school or activity requirements, forms, registrations and everyday planning. A calendar-based calculation is especially useful around month ends and leap years because the number of days in a month varies. For a February 29 birthday, the calculator handles non-leap years explicitly rather than silently using an approximate month length.</p><p>This tool is intended for general informational use. Official age or eligibility decisions should follow the rules of the relevant organization or authority, especially when a specific legal definition of age applies.</p>`,

seo:`<h2>Calculadora de edad por fecha de nacimiento</h2><p>La calculadora de edad de CalcHub permite calcular la edad cronológica a partir de la fecha de nacimiento. Selecciona día, mes y año y, si lo deseas, añade la hora de nacimiento. El resultado muestra años, meses y días, además de meses, semanas, días, horas, minutos y segundos cuando corresponde. También puedes consultar el día de la semana de nacimiento, el signo zodiacal, el próximo cumpleaños y la edad que cumplirás.</p><h3>Cómo usarla</h3><p>Selecciona tu día, mes y año de nacimiento en los menús desplegables. Añade la hora si la conoces y pulsa Calcular edad. El cálculo utiliza meses y años reales del calendario, no una aproximación fija de 90 días por trimestre.</p><h3>Por qué importa la edad cronológica</h3><p>La edad cronológica representa el tiempo transcurrido desde la fecha de nacimiento. Puede ser útil para cumpleaños, requisitos basados en edad, formularios, registros y planificación cotidiana. Los meses no tienen todos la misma duración y los años bisiestos cambian el número de días, por lo que un cálculo basado en el calendario ofrece una representación más clara en los casos límite. Las fechas del 29 de febrero también requieren reglas específicas para años no bisiestos.</p><p>La herramienta es informativa. Para decisiones oficiales, utiliza las reglas de la organización o autoridad correspondiente.</p>`,

seo:`<h2>Calculadora de idade pela data de nascimento</h2><p>A calculadora de idade da CalcHub calcula a idade cronológica a partir da data de nascimento. Selecione dia, mês e ano e, opcionalmente, informe a hora de nascimento. O resultado apresenta anos, meses e dias, além de meses, semanas, dias, horas, minutos e segundos quando apropriado. Também mostra o dia da semana em que você nasceu, o signo do zodíaco, o próximo aniversário e a idade que você completará.</p><h3>Como usar</h3><p>Escolha dia, mês e ano nos menus suspensos. Se souber a hora de nascimento, informe-a no campo opcional e toque em Calcular idade. O cálculo usa meses e anos reais do calendário, em vez de aproximar meses com uma quantidade fixa de dias.</p><h3>Why chronological age matters / Por que a idade cronológica importa</h3><p>A idade cronológica representa o tempo desde a data de nascimento. Ela é útil para aniversários, requisitos baseados em idade, formulários, registros e planejamento cotidiano. Como os meses têm durações diferentes e anos bissextos alteram o calendário, o cálculo baseado em datas reais é mais adequado para situações próximas ao fim do mês. Datas de 29 de fevereiro também exigem tratamento específico em anos não bissextos.</p><p>A ferramenta é informativa. Para decisões oficiais, siga as regras da organização ou autoridade responsável.</p>`,
faqTitle:"Perguntas frequentes",faqs:[["Como a idade cronológica é calculada?","A data de nascimento é comparada com a data atual usando anos, meses e dias do calendário. Com a hora de nascimento, o tempo decorrido pode ser detalhado com maior precisão."],["A calculadora funciona para 29 de fevereiro?","Sim. As regras de anos bissextos são consideradas em vez de usar uma duração fixa para todos os meses."]],

seo:`<h2>Калькулятор возраста по дате рождения</h2><p>Калькулятор CalcHub помогает определить хронологический возраст по дате рождения. Выберите день, месяц и год, а при необходимости добавьте время рождения. Результат показывает годы, месяцы и дни, а также общее количество месяцев, недель, дней, часов, минут и секунд, когда это уместно. Дополнительно отображаются день недели рождения, знак зодиака, следующий день рождения и возраст, который вы исполняете.</p><h3>Как использовать</h3><p>Выберите день, месяц и год рождения в выпадающих списках. При известном времени добавьте его в необязательное поле и нажмите кнопку расчёта. Расчёт использует реальные календарные месяцы и годы, а не приближение каждого месяца фиксированным количеством дней.</p><h3>Почему важен хронологический возраст</h3><p>Хронологический возраст — это время, прошедшее с даты рождения. Он полезен для дней рождения, возрастных требований, анкет, регистрации и повседневного планирования. Поскольку месяцы имеют разное количество дней, календарный расчёт особенно важен на границах месяцев и в високосные годы. Дата 29 февраля также требует отдельной обработки в невисокосные годы.</p><p>Инструмент предназначен для общей информации. Для официальных решений используйте правила соответствующей организации или органа.</p>`,
faqTitle:"Частые вопросы",faqs:[["Как рассчитывается хронологический возраст?","Дата рождения сравнивается с текущей датой по календарным годам, месяцам и дням. При указании времени рождения можно получить более точное время, прошедшее с рождения."],["Учитывается ли 29 февраля?","Да. Учитываются правила високосных лет, без упрощения всех месяцев до фиксированного количества дней."]],

seo:`<h2>按出生日期计算年龄</h2><p>CalcHub 年龄计算器可以根据出生日期计算您的实际年龄。选择出生的日、月、年，也可以填写出生时间，以便在需要时获得更精细的经过时间结果。计算结果包括岁、月、日，以及适用时的总月数、周数、天数、小时、分钟和秒数。同时可以查看出生星期、星座、下一个生日以及即将达到的年龄。</p><h3>如何使用</h3><p>从下拉菜单选择出生日期的日、月和年。如果知道出生时间，可以填写可选时间，然后点击计算年龄。计算采用真实日历中的月份和年份，不把每个月简单按固定天数或 90 天近似处理。</p><h3>Why chronological age matters / 为什么日历年龄重要</h3><p>日历年龄表示从出生日期到现在经过的时间。它适用于生日计算、年龄要求、表格登记以及日常规划。由于不同月份的天数不同，而且闰年会改变日期结构，基于日历的计算在月末和闰年情况下更加清晰。对于 2 月 29 日出生的人，非闰年也需要按照明确的日期规则处理。</p><p>本工具用于一般信息参考。涉及正式资格或法律定义时，请以相关机构的规则为准。</p>`,

 let ms=now-dob,sec=Math.floor(ms/1000),min=Math.floor(sec/60),hr=Math.floor(min/60),days=Math.floor(hr/24),weeks=Math.floor(days/7),wd=days%7,totalMonths=yy*12+mm;
 let ny=now.getFullYear(),nd=d;if(m===2&&d===29&&new Date(ny,1,29).getMonth()!==1)nd=28;let next=new Date(ny,m-1,nd);if(next<=now){ny++;nd=(m===2&&d===29&&new Date(ny,1,29).getMonth()!==1)?28:d;next=new Date(ny,m-1,nd)}
